name: Build Wii Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Wii App
        run: |
          # Install dependencies for GRRLIB
          dkp-pacman -S --noconfirm ppc-freetype ppc-libpng ppc-libjpeg-turbo ppc-zlib
          
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=$DEVKITPRO/devkitPPC
          export PATH=$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$PATH
          
          # Clone and install GRRLIB directly from source
          git clone --depth 1 https://github.com/GRRLIB/GRRLIB.git /tmp/grrlib
          make -C /tmp/grrlib/GRRLIB install
          
          # Build your game
          make BUILD=build

      - name: Debug Output Files
        run: |
          ls -la
          ls -la build || true

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: wii-boot-file
          path: |
            boot.dol
            boot.elf
            build/*.dol
            build/*.elf
